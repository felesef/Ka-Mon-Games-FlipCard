<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Project Monika & Kadri</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>

  <body>
    <div class="container">
      <div class="header-logo">
        <a href="/" aria-label="KAMON Memory Game">
          <img
            src="../images/homepage/kamon-logo.png"
            alt="KAMON Memory Game"
            class="logo"
        /></a>
      </div>

      <div class="stats-container">
        <div class="status">
          <span class="status-label">Moves:</span>
          <span class="status-value" id="movesCounter">0</span>
        </div>
        <div class="status">
          <span class="status-label">Time:</span>
          <span class="status-value" id="timeCounter">0:00</span>
        </div>
      </div>
      <div class="controls">
        <button type="button" class="button" id="newGameBtn">New Game</button>
        <button type="button" class="button" id="scoreboardBtn">
          Scoreboard
        </button>
      </div>
      <div class="setup-container-wrapper">
        <div class="setup-row">
          <div class="setup-container" id="setupContainer">
            <label for="userName">
              <input
                type="text"
                id="userName"
                placeholder="Your name"
                maxlength="100"
              />
            </label>
            <!-- 🔴 [blocking] - onclick="Guest()" calls a function that is never defined anywhere.
                 The button is also "disabled" so it can never be clicked.  -->
            <!-- → Hidden: API requires a name; guest play not supported. -->
            <button type="button" class="button" onclick="Guest()" disabled>
              Play as Guest
            </button>
            <!-- tiles card -->
            <div>
              <ul class="title-list" data-group="choice">
                <li class="title-wrap">
                  <label>
                    <input
                      type="radio"
                      class="title-input"
                      name="choice"
                      value="animals"
                      data-group="choice"
                      data-title="title-1"
                      data-value="1"
                    />
                    <span class="title" data-title-ui="title-1">
                      <span class="title-media">
                        <img
                          src="../images/homepage/animals-theme.png"
                          alt="Animals"
                        />
                      </span>
                      <span class="title-caption">
                        <span>Animals</span>
                      </span>
                    </span>
                  </label>
                </li>
                <li class="title-wrap">
                  <label>
                    <input
                      type="radio"
                      class="title-input"
                      name="choice"
                      value="flags"
                      data-group="choice"
                      data-title="title-1"
                      data-value="1"
                    />
                    <span class="title" data-title-ui="title-1">
                      <span class="title-media">
                        <img
                          src="../images/homepage/flags-theme.png"
                          alt="Flags"
                        />
                      </span>
                      <span class="title-caption">
                        <span>Flags</span>
                      </span>
                    </span>
                  </label>
                </li>
                <li class="title-wrap">
                  <label>
                    <input
                      type="radio"
                      class="title-input"
                      name="choice"
                      value="food"
                      data-group="choice"
                      data-title="title-1"
                      data-value="1"
                    />
                    <span class="title" data-title-ui="title-1">
                      <span class="title-media">
                        <img
                          src="../images/homepage/food-theme.png"
                          alt="Food"
                        />
                      </span>
                      <span class="title-caption">
                        <span>Food</span>
                      </span>
                    </span>
                  </label>
                </li>
                <li class="title-wrap">
                  <label>
                    <input
                      type="radio"
                      class="title-input"
                      name="choice"
                      value="plants"
                      data-group="choice"
                      data-title="title-1"
                      data-value="1"
                    />
                    <span class="title" data-title-ui="title-1">
                      <span class="title-media">
                        <img
                          src="../images/homepage/plants-theme.png"
                          alt="Plants"
                        />
                      </span>
                      <span class="title-caption">
                        <span>Plants</span>
                      </span>
                    </span>
                  </label>
                </li>
                <li class="title-wrap">
                  <label>
                    <input
                      type="radio"
                      class="title-input"
                      name="choice"
                      value="random"
                      data-group="choice"
                      data-title="title-1"
                      data-value="1"
                    />
                    <span class="title" data-title-ui="title-1">
                      <span class="title-media">
                        <img
                          src="../images/homepage/random-theme.png"
                          alt="Random"
                        />
                      </span>
                      <span class="title-caption">
                        <span>Random</span>
                      </span>
                    </span>
                  </label>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="button button-primary" id="startGameBtn">
        Start
      </button>

      <div class="game-area" id="gameArea" hidden>
        <div class="game-board" id="gameBoard"></div>
      </div>
    </div>

    <div class="modal" id="winModal">
      <div class="modal-content">
        <h2>Great job!</h2>
        <h3>⭐️ ⭐️ ⭐️</h3>
        <p>Moves: <span id="finalMoves">0</span></p>
        <p>Time: <span id="finalTime">0:00</span></p>
        <p>Score: <span id="finalScore">0</span></p>
        <p class="scoreboard-hint">Check the scoreboard for your rank.</p>
        <!-- 🔴 [blocking] - finishGame() and nextLevel() are NOT exposed to window in js/main.js.
             These inline onclick handlers will throw "is not defined" errors at runtime.-->
        <!-- → Fixed: addEventListener in main.js for Finish and Next; no inline onclicks. -->
        <button type="button" class="button" id="finishGameBtn">Finish</button>
        <button type="button" class="button" id="nextLevel">Next</button>
        <!-- 🟡 [important] - This close button is disabled, so the user can never click it. Intentional? -->
        <!-- → Hidden: not used; modal is closed via Finish or Next. -->
      </div>
    </div>

    <div class="modal" id="scoreboardModal">
      <div class="modal-content modal-scoreboard">
        <h2>Scoreboard</h2>
        <div id="scoreboardList"></div>
        <button type="button" class="button" id="closeScoreboardBtn">
          Close
        </button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script src="./js/load-fallback.js"></script>
    <!-- 🟡 [important] - Mixing inline onclick handlers (in HTML above) with module-based JS is fragile.
         Prefer addEventListener in main.js for all buttons to keep a single source of truth -->
    <!-- → All buttons use addEventListener in main.js; load fallback in js/load-fallback.js. -->
  </body>
</html>
